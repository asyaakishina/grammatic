<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Грамматическая игра | ОГЭ</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #0f0f1a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    /* Переливающийся фон */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(45deg, #120b3a, #3a0b5a, #5a2b8c, #8a4ec4);
      background-size: 400% 400%;
      animation: gradient 18s ease infinite;
      z-index: -1;
      opacity: 0.6;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .game-container {
      background: rgba(20, 20, 40, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress {
      font-size: 14px;
      color: #ccc;
      margin-bottom: 15px;
      text-align: right;
    }

    .sentence {
      font-size: 18px;
      margin-bottom: 25px;
      line-height: 1.5;
      color: #fff;
      padding: 15px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      text-align: center;
      outline: none;
      transition: 0.3s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input:focus {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.02);
    }

    button {
      padding: 14px 20px;
      width: 100%;
      background: #7b4dff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #6a38e6;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .result-screen {
      font-size: 18px;
      line-height: 1.6;
    }

    .result-screen h2 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #bb86fc;
    }

    .emoji {
      font-size: 30px;
      margin: 10px 0;
    }

    /* Адаптация под маленькие экраны */
    @media (max-width: 480px) {
      .game-container {
        padding: 20px;
        border-radius: 16px;
      }
      .sentence {
        font-size: 16px;
        padding: 12px;
        min-height: 50px;
      }
      input, button {
        font-size: 16px;
        padding: 12px;
      }
      .progress {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div id="gameScreen">
      <div class="progress" id="progress">1 из 10</div>
      <div class="sentence" id="sentence"></div>
      <input type="text" id="answerInput" placeholder="Введите глагол..." autocomplete="off">
      <button id="nextBtn">Проверить и далее</button>
    </div>

    <div id="resultScreen" style="display: none;" class="result-screen">
      <h2>Игра завершена! 🎉</h2>
      <p>Правильно: <strong id="correctCount"></strong> из 10</p>
      <div class="emoji" id="emoji"></div>
      <p id="finalMessage"></p>
      <button id="restartBtn" style="margin-top: 20px;">Играть снова</button>
    </div>
  </div>

  <script>
    const sentences = [
      "She usually (go) ______ to school by bus.",
      "They (play) ______ football yesterday afternoon.",
      "Look! The dog (run) ______ in the garden.",
      "I (never / be) ______ to London.",
      "We (visit) ______ our grandparents next weekend.",
      "He (do) ______ his homework every evening.",
      "When I came home, my brother (watch) ______ TV.",
      "They (live) ______ in this city since 2015.",
      "If it rains, we (stay) ______ at home.",
      "By 5 p.m. yesterday, she (finish) ______ her project."
    ];

    const correctAnswers = [
      "goes",
      "played",
      "is running",
      "have never been",
      "will visit",
      "does",
      "was watching",
      "have lived",
      "will stay",
      "had finished"
    ];

    const sentenceEl = document.getElementById("sentence");
    const inputEl = document.getElementById("answerInput");
    const progressEl = document.getElementById("progress");
    const nextBtn = document.getElementById("nextBtn");
    const gameScreen = document.getElementById("gameScreen");
    const resultScreen = document.getElementById("resultScreen");
    const correctCountEl = document.getElementById("correctCount");
    const finalMessageEl = document.getElementById("finalMessage");
    const emojiEl = document.getElementById("emoji");
    const restartBtn = document.getElementById("restartBtn");

    let currentIdx = 0;
    let correctCount = 0;

    // Загружаем первое предложение
    function loadSentence() {
      sentenceEl.textContent = sentences[currentIdx];
      inputEl.value = "";
      progressEl.textContent = `${currentIdx + 1} из ${sentences.length}`;
      inputEl.focus();
    }

    // Проверка ответа
    nextBtn.addEventListener("click", () => {
      const userAnswer = inputEl.value.trim().toLowerCase();
      const correctAnswer = correctAnswers[currentIdx].toLowerCase();

      if (userAnswer === correctAnswer) {
        correctCount++;
      }

      currentIdx++;

      if (currentIdx < sentences.length) {
        loadSentence();
      } else {
        // Конец игры
        gameScreen.style.display = "none";
        resultScreen.style.display = "block";

        correctCountEl.textContent = correctCount;

        if (correctCount === 10) {
          emojiEl.textContent = "🏆";
          finalMessageEl.textContent = "Безупречно! Ты настоящий мастер грамматики!";
        } else if (correctCount >= 7) {
          emojiEl.textContent = "👏";
          finalMessageEl.textContent = "Хорошая работа! Почти всё правильно!";
        } else {
          emojiEl.textContent = "💪";
          finalMessageEl.textContent = "Ещё немного практики — и у тебя всё получится!";
        }
      }
    });

    // Перезапуск игры
    restartBtn.addEventListener("click", () => {
      currentIdx = 0;
      correctCount = 0;
      gameScreen.style.display = "block";
      resultScreen.style.display = "none";
      loadSentence();
    });

    // Ввод с клавиатуры (Enter)
    inputEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        nextBtn.click();
      }
    });

    // Автофокус при загрузке
    window.addEventListener("DOMContentLoaded", () => {
      loadSentence();
    });
  </script>
</body>
</html>
